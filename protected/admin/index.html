<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Event</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family: Arial, sans-serif;
      color: #000;
      background: #FFF8E7;
    }

    body {
      width: min(100% - 32px, 1200px);
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    h1,
    h2 {
      font-family: "Arial Black", Arial, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 24px;
      font-size: clamp(2rem, 6vw, 3.5rem);
      line-height: 1;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 1.5rem;
    }

    .card {
      min-width: 0;
      margin-bottom: 28px;
      padding: 24px;
      border: 3px solid #000;
      border-radius: 4px;
      background: #fff;
      box-shadow: 6px 6px 0 #000;
    }

    #form {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
    }

    .form-field {
      display: grid;
      min-width: 0;
      gap: 8px;
    }

    .form-field label {
      font-weight: 800;
    }

    input,
    select,
    button {
      min-width: 0;
      min-height: 48px;
      padding: 10px 12px;
      border: 3px solid #000;
      border-radius: 4px;
      color: #000;
      font: inherit;
    }

    input,
    select {
      width: 100%;
      background: #fff;
    }

    input:focus,
    select:focus {
      outline: 3px solid #FFD60A;
      outline-offset: 2px;
    }

    #preview {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      border: 3px solid #000;
      border-radius: 4px;
    }

    .category-entry {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
    }

    .category-list {
      display: grid;
      gap: 10px;
      margin: 18px 0 0;
      padding: 0;
      list-style: none;
    }

    .category-list li {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px;
      border: 2px solid #000;
      overflow-wrap: anywhere;
    }

    .category-list button {
      flex: 0 0 auto;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    button {
      cursor: pointer;
      font-weight: 800;
      box-shadow: 4px 4px 0 #000;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    button:hover {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 #000;
    }

    button:active {
      transform: translate(4px, 4px);
      box-shadow: none;
    }

    .save-button {
      background: #FFD60A;
    }

    .cancel-button {
      background: #fff;
    }

    .edit-button {
      background: #7AE7C7;
    }

    .delete-button {
      background: #FF6B9D;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 3px solid #000;
      border-radius: 4px;
    }

    table {
      width: 100%;
      min-width: 680px;
      border-collapse: collapse;
      background: #fff;
    }

    th,
    td {
      padding: 12px;
      border: 2px solid #000;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #FFD60A;
      font-weight: 900;
      text-transform: uppercase;
    }

    td:last-child button + button {
      margin-left: 8px;
    }

    @media (min-width: 768px) {
      #form {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #form button {
        width: fit-content;
        min-width: 130px;
      }
    }

    @media (max-width: 480px) {
      body {
        width: min(100% - 24px, 1200px);
        padding-top: 24px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>
  <h1>Admin Event</h1>

  <section class="card">
    <h2 id="judul">Tambah Event</h2>
    <form id="form">
      <input type="text" id="nama" placeholder="Nama event" required>
      <input type="text" id="deskripsi" placeholder="Deskripsi">
      <input type="datetime-local" id="tanggal" required>
      <input type="text" id="lokasi" placeholder="Lokasi" required>
      <input type="number" id="kapasitas" placeholder="Kapasitas" min="1" required>
      <input type="number" id="harga" placeholder="Harga" min="0">
      <div class="form-field">
        <label for="kategori">Kategori</label>
        <select id="kategori">
          <option value="">Tanpa kategori</option>
        </select>
      </div>
      <div class="form-field">
        <label for="gambarFile">Gambar event</label>
        <input type="file" id="gambarFile" name="gambar" accept=".jpg,.jpeg,.png,.webp">
      </div>
      <div class="form-field">
        <input type="hidden" id="gambar">
        <img id="preview" alt="Preview gambar event" hidden>
      </div>
      <button class="save-button" type="submit">Simpan</button>
      <button class="cancel-button" type="button" onclick="resetForm()">Batal</button>
    </form>
  </section>

  <section class="card">
    <h2>Kelola Kategori</h2>
    <div class="category-entry">
      <input type="text" id="namaKategori" placeholder="Nama kategori">
      <button class="save-button" type="button" onclick="tambahKategori()">Tambah</button>
    </div>
    <ul class="category-list" id="daftarKategori"></ul>
  </section>

  <section class="card">
    <h2>Daftar Event</h2>
    <div class="table-wrap">
      <table border="1" cellpadding="6">
        <thead>
          <tr>
            <th>ID</th><th>Nama</th><th>Tanggal</th>
            <th>Lokasi</th><th>Kapasitas</th><th>Harga</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="tabel"></tbody>
      </table>
    </div>
  </section>

<script>
  const API = "/api/events";
  let daftar = [];
  let editId = null;

  const form = document.getElementById("form");

  async function muatKategori() {
    try {
      const res = await fetch("/api/categories");
      if (!res.ok) {
        throw new Error("Gagal memuat kategori, status: " + res.status);
      }

      const kategori = await res.json();
      const select = document.getElementById("kategori");
      const nilaiTerpilih = select.value;
      const opsiAwal = document.createElement("option");
      opsiAwal.value = "";
      opsiAwal.textContent = "Tanpa kategori";
      select.replaceChildren(opsiAwal);

      const daftarKategori = document.getElementById("daftarKategori");
      daftarKategori.replaceChildren();

      kategori.forEach((item) => {
        const opsi = document.createElement("option");
        opsi.value = item.id;
        opsi.textContent = item.nama;
        select.appendChild(opsi);

        const baris = document.createElement("li");
        const nama = document.createElement("span");
        nama.textContent = item.nama;
        const tombolHapus = document.createElement("button");
        tombolHapus.type = "button";
        tombolHapus.className = "delete-button";
        tombolHapus.textContent = "Hapus";
        tombolHapus.addEventListener("click", () => hapusKategori(item.id));
        baris.append(nama, tombolHapus);
        daftarKategori.appendChild(baris);
      });

      if ([...select.options].some((opsi) => opsi.value === nilaiTerpilih)) {
        select.value = nilaiTerpilih;
      }
    } catch (error) {
      console.error(error);
      alert(error.message);
    }
  }

  async function tambahKategori() {
    const input = document.getElementById("namaKategori");
    const nama = input.value.trim();
    if (!nama) {
      alert("Nama kategori wajib diisi.");
      return;
    }

    try {
      const res = await fetch("/api/categories", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nama }),
      });
      const hasil = await res.json();
      if (!res.ok) {
        alert(hasil.error || "Gagal menambahkan kategori.");
        return;
      }
      input.value = "";
      await muatKategori();
    } catch (error) {
      console.error(error);
      alert("Gagal menambahkan kategori.");
    }
  }

  async function hapusKategori(id) {
    if (!confirm("Yakin hapus kategori ini?")) return;

    try {
      const res = await fetch(`/api/categories/${id}`, { method: "DELETE" });
      const hasil = await res.json();
      if (!res.ok) {
        alert(hasil.error || "Gagal menghapus kategori.");
        return;
      }
      await muatKategori();
    } catch (error) {
      console.error(error);
      alert("Gagal menghapus kategori.");
    }
  }

  function setPreview(url) {
    const preview = document.getElementById("preview");
    document.getElementById("gambar").value = url || "";
    preview.src = url || "";
    preview.hidden = !url;
  }

  document.getElementById("gambarFile").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const tombolSimpan = form.querySelector('button[type="submit"]');
    tombolSimpan.disabled = true;
    const data = new FormData();
    data.append("gambar", file);

    try {
      const res = await fetch("/api/uploads", {
        method: "POST",
        body: data,
      });
      const hasil = await res.json();
      if (!res.ok) {
        throw new Error(hasil.error || "Gagal mengunggah gambar.");
      }
      setPreview(hasil.url);
    } catch (error) {
      console.error(error);
      alert(error.message);
      event.target.value = "";
    } finally {
      tombolSimpan.disabled = false;
    }
  });

  async function muatEvent() {
    const res = await fetch(API);
    daftar = await res.json();
    document.getElementById("tabel").innerHTML = daftar.map(e => `
      <tr>
        <td>${e.id}</td>
        <td>${e.nama}</td>
        <td>${new Date(e.tanggal).toLocaleString("id-ID")}</td>
        <td>${e.lokasi}</td>
        <td>${e.kapasitas}</td>
        <td>${e.harga}</td>
        <td>
          <button class="edit-button" onclick="isiForm(${e.id})">Edit</button>
          <button class="delete-button" onclick="hapus(${e.id})">Hapus</button>
        </td>
      </tr>`).join("");
  }

  // Ubah tanggal dari database ke format yang dimengerti input datetime-local
  function keLokal(tgl) {
    const d = new Date(tgl);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 16);
  }

  function isiForm(id) {
    const e = daftar.find(x => x.id === id);
    editId = id;
    document.getElementById("judul").textContent = "Edit Event #" + id;
    document.getElementById("nama").value = e.nama;
    document.getElementById("deskripsi").value = e.deskripsi || "";
    document.getElementById("tanggal").value = keLokal(e.tanggal);
    document.getElementById("lokasi").value = e.lokasi;
    document.getElementById("kapasitas").value = e.kapasitas;
    document.getElementById("harga").value = e.harga;
    document.getElementById("kategori").value = e.category_id || "";
    setPreview(e.image_url || "");
  }

  function resetForm() {
    form.reset();
    editId = null;
    document.getElementById("judul").textContent = "Tambah Event";
    setPreview("");
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const body = {
      nama: document.getElementById("nama").value,
      deskripsi: document.getElementById("deskripsi").value,
      tanggal: document.getElementById("tanggal").value,
      lokasi: document.getElementById("lokasi").value,
      kapasitas: Number(document.getElementById("kapasitas").value),
      harga: Number(document.getElementById("harga").value),
      category_id: document.getElementById("kategori").value || null,
      image_url: document.getElementById("gambar").value || null,
    };

    const res = await fetch(editId ? `${API}/${editId}` : API, {
      method: editId ? "PUT" : "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      alert("Gagal menyimpan, status: " + res.status);
      return;
    }
    resetForm();
    muatEvent();
  });

  async function hapus(id) {
    if (!confirm("Yakin hapus event ini?")) return;
    await fetch(`${API}/${id}`, { method: "DELETE" });
    muatEvent();
  }

  async function mulai() {
    await muatKategori();
    await muatEvent();
  }

  mulai();
</script>
</body>
</html>
