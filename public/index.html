<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Event</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      font-family: Arial, sans-serif;
      color: #000;
      background: #FFF8E7;
    }

    body {
      width: min(100% - 32px, 1200px);
      margin: 0 auto;
      padding: 40px 0 56px;
    }

    h1,
    h2 {
      font-family: "Arial Black", Arial, sans-serif;
      font-weight: 900;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(2.5rem, 8vw, 5rem);
      line-height: 1;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }

    input,
    select,
    .event-link {
      width: 100%;
      min-width: 0;
      min-height: 52px;
      padding: 12px 14px;
      border: 3px solid #000;
      border-radius: 4px;
      color: #000;
      font: inherit;
    }

    input,
    select {
      background: #fff;
      box-shadow: 6px 6px 0 #000;
    }

    input:focus,
    select:focus {
      outline: 3px solid #FFD60A;
      outline-offset: 2px;
    }

    #daftar {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
    }

    .event-card {
      display: flex;
      min-width: 0;
      min-height: 320px;
      align-items: flex-end;
      overflow: hidden;
      border: 3px solid #000;
      border-radius: 4px;
      background-color: #9B9B9B;
      background-position: center;
      background-size: cover;
      box-shadow: 6px 6px 0 #000;
    }

    .event-overlay {
      width: 100%;
      min-width: 0;
      padding: 18px;
      background: rgba(0, 0, 0, 0.76);
      color: #fff;
    }

    .event-overlay h2 {
      overflow-wrap: anywhere;
      margin: 0 0 8px;
      font-size: 1.4rem;
    }

    .event-overlay p {
      margin: 6px 0;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }

    .event-link {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      background: #7AE7C7;
      box-shadow: 6px 6px 0 #000;
      font-weight: 800;
      text-decoration: none;
      transition: transform 120ms ease, box-shadow 120ms ease;
    }

    .event-link:hover {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 #000;
    }

    .empty-message {
      grid-column: 1 / -1;
      margin: 0;
      padding: 20px;
      border: 3px solid #000;
      border-radius: 4px;
      background: #FFD60A;
      box-shadow: 6px 6px 0 #000;
      font-weight: 800;
    }

    @media (min-width: 768px) {
      .filters {
        grid-template-columns: minmax(0, 2fr) minmax(200px, 1fr) minmax(200px, 1fr);
      }

      #daftar {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      }
    }

    @media (max-width: 480px) {
      body {
        width: min(100% - 24px, 1200px);
        padding-top: 28px;
      }

      .event-card {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>DAFTAR EVENT</h1>

    <div class="filters">
      <input type="search" id="cari" placeholder="Cari nama atau lokasi" aria-label="Cari nama, lokasi, atau kategori">
      <select id="kategori" aria-label="Filter kategori">
        <option value="semua">Semua kategori</option>
      </select>
      <select id="rentang" aria-label="Filter rentang waktu">
        <option value="semua">Semua</option>
        <option value="7">7 hari ke depan</option>
        <option value="30">30 hari ke depan</option>
      </select>
    </div>

    <section id="daftar" aria-live="polite"></section>
  </main>

  <script>
    let events = [];
    const daftar = document.getElementById("daftar");
    const inputCari = document.getElementById("cari");
    const selectKategori = document.getElementById("kategori");
    const selectRentang = document.getElementById("rentang");

    function urlGambar(value) {
      return typeof value === "string" && /^\/uploads\/[A-Za-z0-9._-]+$/.test(value)
        ? value
        : "";
    }

    function tampilkanEvent() {
      const kataKunci = inputCari.value.trim().toLocaleLowerCase("id-ID");
      const kategoriDipilih = selectKategori.value;
      const rentang = selectRentang.value;
      const sekarang = new Date();
      const batasTanggal = rentang === "semua"
        ? null
        : new Date(sekarang.getTime() + Number(rentang) * 24 * 60 * 60 * 1000);

      const eventCocok = events.filter((event) => {
        const nama = String(event.nama ?? "").toLocaleLowerCase("id-ID");
        const lokasi = String(event.lokasi ?? "").toLocaleLowerCase("id-ID");
        const kategori = String(event.kategori ?? "").toLocaleLowerCase("id-ID");
        const cocokKataKunci = nama.includes(kataKunci)
          || lokasi.includes(kataKunci)
          || kategori.includes(kataKunci);
        const cocokKategori = kategoriDipilih === "semua"
          || String(event.category_id ?? "") === kategoriDipilih;

        if (!cocokKataKunci || !cocokKategori) return false;
        if (batasTanggal === null) return true;

        const tanggalEvent = new Date(event.tanggal);
        return !Number.isNaN(tanggalEvent.getTime())
          && tanggalEvent >= sekarang
          && tanggalEvent <= batasTanggal;
      });

      daftar.replaceChildren();

      if (eventCocok.length === 0) {
        const pesan = document.createElement("p");
        pesan.className = "empty-message";
        pesan.textContent = "Tidak ada event yang cocok";
        daftar.appendChild(pesan);
        return;
      }

      eventCocok.forEach((event) => {
        const kartu = document.createElement("article");
        kartu.className = "event-card";
        const imageUrl = urlGambar(event.image_url);
        if (imageUrl) {
          kartu.style.backgroundImage = `url("${imageUrl}")`;
        }

        const overlay = document.createElement("div");
        overlay.className = "event-overlay";

        const nama = document.createElement("h2");
        nama.textContent = event.nama;

        const kategori = document.createElement("p");
        kategori.textContent = `Kategori: ${event.kategori || "Tanpa kategori"}`;

        const tanggal = document.createElement("p");
        tanggal.textContent = new Date(event.tanggal).toLocaleString("id-ID");

        const lokasi = document.createElement("p");
        lokasi.textContent = `Lokasi: ${event.lokasi}`;

        const harga = document.createElement("p");
        harga.textContent = `Harga: ${event.harga}`;

        const tautan = document.createElement("a");
        tautan.className = "event-link";
        tautan.href = `/event.html?id=${encodeURIComponent(event.id)}`;
        tautan.textContent = "Pilih event ini";

        overlay.append(nama, kategori, tanggal, lokasi, harga, tautan);
        kartu.appendChild(overlay);
        daftar.appendChild(kartu);
      });
    }

    async function muatEvent() {
      try {
        const response = await fetch("/api/events");
        if (!response.ok) {
          throw new Error(`Gagal memuat event: status ${response.status}`);
        }
        events = await response.json();
        tampilkanEvent();
      } catch (error) {
        console.error(error);
        daftar.replaceChildren();
        const pesan = document.createElement("p");
        pesan.className = "empty-message";
        pesan.textContent = "Event gagal dimuat. Silakan muat ulang halaman.";
        daftar.appendChild(pesan);
      }
    }

    async function muatKategori() {
      try {
        const response = await fetch("/api/categories");
        if (!response.ok) {
          throw new Error(`Gagal memuat kategori: status ${response.status}`);
        }
        const categories = await response.json();
        categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category.id;
          option.textContent = category.nama;
          selectKategori.appendChild(option);
        });
        tampilkanEvent();
      } catch (error) {
        console.error(error);
      }
    }

    inputCari.addEventListener("input", tampilkanEvent);
    selectKategori.addEventListener("change", tampilkanEvent);
    selectRentang.addEventListener("change", tampilkanEvent);

    muatEvent();
    muatKategori();
  </script>
</body>
</html>
